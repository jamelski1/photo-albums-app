services:
  - type: web
    name: photo-albums
    env: python
    # Standard (2 GB RAM): the ResNet-50 step needs more memory than the
    # free and starter tiers give, and the service will run out of memory
    # there. Change the plan in the Render dashboard if you accept that.
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 900 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Jamendo API client ID for real Creative Commons tracks. Set the
      # value in the Render dashboard (Environment tab); it is never
      # committed to the repository. Without it the app falls back to
      # its synthesized music library.
      - key: JAMENDO_CLIENT_ID
        sync: false
